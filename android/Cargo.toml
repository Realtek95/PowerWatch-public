[workspace]
members = ["crates/powerwatch-core", "crates/powerwatch-addresses", "crates/powerwatch-providers", "crates/powerwatch-storage", "crates/powerwatch-notifications", "crates/powerwatch-runtime", "crates/powerwatch-updates", "apps/powerwatch/src-tauri"]
resolver = "3"

[workspace.package]
version = "1.0.5"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
powerwatch-core = { path = "crates/powerwatch-core" }
powerwatch-addresses = { path = "crates/powerwatch-addresses" }
powerwatch-providers = { path = "crates/powerwatch-providers" }
powerwatch-storage = { path = "crates/powerwatch-storage" }
powerwatch-notifications = { path = "crates/powerwatch-notifications" }
powerwatch-runtime = { path = "crates/powerwatch-runtime" }
powerwatch-updates = { path = "crates/powerwatch-updates" }

# The managed Windows filesystem cannot hard-link incremental cache files.
[profile.dev]
incremental = false
